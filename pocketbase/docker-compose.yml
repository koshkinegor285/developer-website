# Админ-панель PocketBase. Запуск: docker compose up -d --build  (из этой папки)
# Админка: http://localhost:8090/_/
services:
  pocketbase:
    build: .
    restart: unless-stopped
    ports:
      - "${PB_PORT:-8090}:8090"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Сайт шлёт заявки из браузера: разрешаем только его домены
      SITE_ORIGINS: ${SITE_ORIGINS}
      REBUILD_URL: http://builder:3000/rebuild
      REBUILD_TOKEN: ${REBUILD_TOKEN}
    volumes:
      - pb_data:/pb_data
      - ./pb_migrations:/pb_migrations
      - ./pb_hooks:/pb_hooks:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8090/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Пересборка сайта при изменениях в админке
  builder:
    image: node:24-alpine
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    working_dir: /site
    command: node /builder/server.mjs
    environment:
      REBUILD_TOKEN: ${REBUILD_TOKEN}
      POCKETBASE_URL: http://pocketbase:8090
      PUBLIC_PB_URL: ${PUBLIC_URL}
    volumes:
      - ./builder:/builder:ro
      - ../build.mjs:/site/build.mjs:ro
      - ../data:/site/data:ro
      - ../src:/site/src:ro
      - site:/out

  # Одноразовая загрузка стартового содержимого из data/content.json (повторный запуск безопасен)
  seed:
    image: node:24-alpine
    depends_on:
      builder:
        condition: service_started
    working_dir: /app
    command: node seed.mjs
    environment:
      POCKETBASE_URL: http://pocketbase:8090
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - ./seed.mjs:/app/seed.mjs:ro
      - ../data/content.json:/data/content.json:ro

  # Готовый сайт (локально http://localhost:8081)
  site:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${SITE_PORT:-8081}:80"
    volumes:
      - site:/usr/share/nginx/html:ro

volumes:
  site:
  pb_data:
